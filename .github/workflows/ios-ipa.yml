name: Produire une IPA signée

on:
  workflow_dispatch:
    inputs:
      distribution:
        description: 'Ad Hoc : iPhone enregistré ; App Store Connect : export pour TestFlight'
        type: choice
        required: true
        default: ad-hoc
        options:
          - ad-hoc
          - app-store-connect

permissions:
  contents: read

jobs:
  signed-ipa:
    runs-on: macos-15
    timeout-minutes: 45
    environment: ios-signing
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
      IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
      DISTRIBUTION: ${{ inputs.distribution }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Préparer et vérifier
        run: |
          test -n "$IOS_BUNDLE_ID" || { echo '::error::Configurer la variable IOS_BUNDLE_ID'; exit 1; }
          test -n "$IOS_TEAM_ID" || { echo '::error::Configurer la variable IOS_TEAM_ID'; exit 1; }
          npm ci
          node scripts/configure-ios.mjs
          npm run ios:sync
          npm run check
          python3 -m unittest discover -s tests -p 'test_*.py'
          xcodebuild -version
      - name: Installer et contrôler la signature
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: bash scripts/install-signing.sh
      - name: Archiver pour iPhone et exporter l’IPA
        run: |
          set -o pipefail
          node scripts/configure-signing.mjs
          mkdir -p build/export
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/A-LAFFICHE.xcarchive \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" archive | tee build/archive.log
          xcodebuild -exportArchive -archivePath build/A-LAFFICHE.xcarchive \
            -exportPath build/export -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" | tee build/export.log
          python3 scripts/verify-ipa.py
      - name: Télécharger l’IPA depuis les artefacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: A-LAFFICHE-IPA-${{ inputs.distribution }}-${{ github.run_number }}
          path: build/export/*.ipa
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Effacer les éléments de signature
        if: always()
        run: bash scripts/cleanup-signing.sh
