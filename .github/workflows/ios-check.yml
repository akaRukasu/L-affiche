name: Vérifier iOS sans certificat

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Préparer le catalogue et le projet natif
        run: |
          npm ci
          node scripts/configure-ios.mjs
          npm run ios:sync
          npm run check
          python3 -m unittest discover -s tests -p 'test_*.py'
          plutil -lint ios/App/App/Info.plist
          xcodebuild -version
      - name: Compiler pour le simulateur sans signature
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO build | tee build/simulator.log
          ditto -c -k --sequesterRsrc --keepParent build/DerivedData/Build/Products/Debug-iphonesimulator/App.app build/A-LAFFICHE-simulateur.zip
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: A-LAFFICHE-simulateur-${{ github.run_number }}
          path: build/A-LAFFICHE-simulateur.zip
          if-no-files-found: error
          retention-days: 7
