name: Produire une IPA iPhone non signée

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ios-unsigned-ipa.yml'
      - 'scripts/verify-unsigned-ipa.py'
      - 'ios/**'
      - 'src/**'
      - 'public/**'
      - 'assets/**'
      - 'package*.json'
      - 'capacitor.config.json'
      - 'vite.config.js'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsigned-iphone:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Préparer et vérifier le projet
        run: |
          npm ci
          node scripts/configure-ios.mjs
          npm run ios:sync
          npm run check
          python3 -m unittest discover -s tests -p 'test_*.py'
          xcodebuild -version
      - name: Compiler pour un iPhone réel, sans signature de distribution
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/A-LAFFICHE-non-signee.xcarchive \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" archive | tee build/unsigned-archive.log
      - name: Créer et contrôler l’IPA non signée
        run: |
          mkdir -p build/unsigned/Payload
          ditto build/A-LAFFICHE-non-signee.xcarchive/Products/Applications/App.app build/unsigned/Payload/App.app
          ditto -c -k --norsrc --keepParent build/unsigned/Payload build/A-LAFFICHE-0.2.0-NON-SIGNEE.ipa
          python3 scripts/verify-unsigned-ipa.py build/A-LAFFICHE-0.2.0-NON-SIGNEE.ipa
          printf '%s\n' \
            'À L’AFFICHE — IPA iPhone NON SIGNÉE' \
            'Ce fichier contient une application compilée pour iPhone arm64.' \
            'Il ne possède pas de signature Apple de distribution valide.' \
            'Une signature et un provisionnement valides sont nécessaires avant installation.' \
            'Pour un export signé : utiliser le workflow Produire une IPA signée.' \
            > build/LIRE-AVANT-INSTALLATION.txt
          shasum -a 256 build/A-LAFFICHE-0.2.0-NON-SIGNEE.ipa > build/SHA256-IPA.txt
          printf '%s\n' \
            '## IPA iPhone non signée produite' \
            'Télécharger l’artefact A-LAFFICHE-IPA-NON-SIGNEE ci-dessous.' \
            '**Signature valide requise avant installation sur iPhone.**' \
            >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: A-LAFFICHE-IPA-NON-SIGNEE-${{ github.run_number }}
          path: |
            build/A-LAFFICHE-0.2.0-NON-SIGNEE.ipa
            build/LIRE-AVANT-INSTALLATION.txt
            build/SHA256-IPA.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
